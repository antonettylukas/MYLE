# Prüft jede Änderung. Was auf den Zweig "vorschau" kommt, geht nur dann auf "main"
# (und damit über Cloudflare auf myle.life), wenn die Prüfung keine Fehler findet.
name: Prüfen und online stellen

on:
  push:
    branches: [vorschau, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pruefen-${{ github.ref }}

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Website prüfen
        run: python3 .github/pruefung/pruefe.py
      # Lighthouse (Handy) für eine Auswahl von Seiten und axe-core (Kontrast, Knopfgröße, Beschriftungen) für alle
      # Seiten in hell und dunkel. Schwelle: jede Lighthouse-Wertung mindestens 90 und kein axe-Verstoß.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .github/pruefung/package-lock.json
      - name: Werkzeuge für die Qualitätsprüfung
        run: npm ci --no-audit --no-fund --prefix .github/pruefung
      - name: Qualität prüfen (Lighthouse und Barrierefreiheit)
        run: node .github/pruefung/qualitaet.js --messen
      - name: Online stellen (vorschau nach main)
        if: github.ref == 'refs/heads/vorschau'
        run: git push origin HEAD:main
